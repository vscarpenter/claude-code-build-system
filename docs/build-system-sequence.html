:root[data-theme=&quot;light&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;

}

.table-responsive {

.table :is(th, td) {

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

}

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;

  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

  gap: 2px 12px;

.btn,

.btn:not(:disabled):hover {

.form-control:disabled,

    const steps = [

        mutation: &quot;Lease reference via compare-and-swap&quot;,
        proof: &quot;lease commit SHA&quot;,
        next: &quot;Bounded planning request&quot;
      },
      {
        title: &quot;Plan&quot;,
        custody: &quot;worker custody&quot;,
        summary: &quot;A bounded harness proposes the implementation plan. Schema validation rejects malformed output and unrecognized fields.&quot;,

        proof: &quot;schema-valid agent result&quot;,

        summary: &quot;A maintainer approves the exact contract and plan digests. Any later contract edit invalidates the approval.&quot;,

        proof: &quot;approver + bound digests&quot;,
        next: &quot;Isolated implementation&quot;

        proof: &quot;registered worktree + base SHA&quot;,
        next: &quot;Deterministic verification&quot;
      },
      {

        summary: &quot;The controller audits the real Git diff, enforces path policy, and runs approved verification commands on the exact candidate.&quot;,
        mutation: &quot;Controller-authored candidate commit&quot;,
        proof: &quot;audited diff + command exits&quot;,
        next: &quot;Exact-SHA delivery&quot;
      },
      {
        title: &quot;Deliver&quot;,
        custody: &quot;platform + human custody&quot;,
        summary: &quot;The controller pushes one verified SHA and confirms the pull-request postcondition. Gate 2 remains a human merge protected by repository rules.&quot;,
        mutation: &quot;Branch + pull-request metadata&quot;,
        proof: &quot;remote SHA + PR provenance&quot;,
        next: &quot;Human review and merge&quot;

    ];

    const fields = {
      title: root.querySelector(&quot;#sequence-detail-title&quot;),

      next: root.querySelector(&quot;#sequence-next&quot;),
      announcer: root.querySelector(&quot;#sequence-announcer&quot;)
    };

    const render = (index) =&gt; {
      const step = steps[index];
      detail.classList.add(&quot;is-changing&quot;);
      buttons.forEach((button, buttonIndex) =&gt; {
        button.setAttribute(&quot;aria-pressed&quot;, String(buttonIndex === index));
        button.closest(&quot;li&quot;).dataset.passed = String(buttonIndex &lt; index);
